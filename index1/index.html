<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Bouquets</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Love+Light&family=Playwrite+CO:wght@100..400&family=Vina+Sans&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #D8A2A2;
        }

        .wrapper {
            max-width: 810px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .a2, .a3, .a4 {
            color: #303841;
            width: 250px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: #FFDCDC;
        }

        .a2 img, .a3 img, .a4 img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .a1 {
            color: #0D1C42;
            font-size: 30px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #dad6d6;
            border-radius: 5px;
            text-align: center;
            margin: 10px 0;
            box-sizing: border-box;
            background-color: #F3E6D5;
            font-family: "Love Light", cursive;
        }

        h3 {
            color: #0D1C42;
            font-family: "Playwrite CO", cursive, sans-serif;
        }

        p {
            color: #0D1C42;
            font-family: "Vina Sans", sans-serif;
        }
    </style>

</head>

<body>

    <div class="wrapper">

    <div class="a1"><h3>Flower Bouquets</h3></div>

    <br>

    <div class="container">

        <div class="a2">
            <img src="img/basket.jpg" alt="Basket Bouquet">
            <h3>Basket Bouquet</h3>
            <p>Beautiful basket bouquet</p>
        </div>

        <div class="a3">
            <img src="img/posy.jpg" alt="Posy Bouquet">
            <h3>Posy Bouquet</h3>
            <p>Simple and elegant bouquet</p>
        </div>

        <div class="a4">
            <img src="img/thumbelina.jpg" alt="Thumbelina">
            <h3>Thumbelina</h3>
            <p>Small and lovely bouquet</p>
        </div>

    </div>

    </div>

</body>

</html>
